r you reunite returns a little color to the world. That is the old magic of the Library."},{who:"wen",text:"Match two tiles that are alike, and free on one side. Begin here, on the courtyard stones."}],boards:[{layout:"petal",copies:2,hints:-1,shuffles:-1},{layout:"garden",copies:2,hints:-1,shuffles:-1,between:[{who:"kito",text:"Ohh, color! How delicious. Do you mind if I… borrow a few of these?"},{who:"you",text:"A fox? Give those tiles back!"},{who:"kito",text:"Catch me in the garden, Wayfarer. Or don’t. I’m very fast and very charming."}]}],outro:[{who:"kito",text:"Fine, fine. You win. You’re surprisingly good at this for someone with no tail."},{who:"wen",text:"Kito. I wondered when you would show yourself again."},{who:"kito",text:"Old Wen! You look… older. I can help. I know where the Emperor hid the other tiles. Mostly."},{who:"wen",text:"Then go together. Eight realms, eight winds. Bring the Lantern back to life."}],fragment:{title:"The First Wind",text:"The East Wind woke the blossoms each spring. It was the youngest of the winds, and the most forgetful — so it carved its name onto a tile, so it would never forget who it was."}},{id:1,title:"Whispers in the Mist",subtitle:"Chapter II",biome:1,intro:[{who:"narrator",text:"The Bamboo Highlands rustle with voices, but no one is there."},{who:"kito",text:"Careful. The Emperor breathes on things he wants hidden. See how some tiles are veiled?"},{who:"you",text:"I can’t read their faces."},{who:"kito",text:"The mist lifts once a tile is free. Plan ahead — clear the ones you can see, and the hidden ones reveal themselves."},{who:"emperor",text:"…why do you bother, little Wayfarer? Colors fade. Names are forgotten. Everything returns to grey."},{who:"you",text:"Who said that?"},{who:"kito",text:"Ignore him. He talks a lot for someone with no face."}],boards:[{layout:"koi",copies:2,mist:.5,hints:3,shuffles:2}],outro:[{who:"kito",text:"The bamboo is green again. Listen — it’s laughing."},{who:"you",text:"Kito… how do
